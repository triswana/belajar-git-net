<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Tamu</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h3>Buku Tamu</h3>

  <form id="form">
    <input type="text" id="nama" placeholder="Isi nama Anda" required>
    <button type="submit">Kirim</button>
  </form>

  <h4>Daftar Hadir</h4>
  <ul id="daftar"></ul>

  <script>
    // 1. PASTIKAN URL Hanya Sampai "...supabase.co/rest/v1"
    const SUPABASE_BASE_URL = "https://wprvdlbfsurjytgikokp.supabase.co/rest/v1";
    
    // 2. TEMPEL KUNCI 'anon' 'public' LENGKAP DI SINI (Ketik ulang/salin dari Settings > API)
    const SUPABASE_KEY = "sb_publishable_Vl18fW-IfHmiNdwtOAFygQ_yHDckGA7";

    const headers = {
      "apikey": SUPABASE_KEY.trim(),
      "Authorization": `Bearer ${SUPABASE_KEY.trim()}`,
      "Content-Type": "application/json"
    };

    async function load() {
      try {
        // Panggil endpoint tabel
        const res = await fetch(`${SUPABASE_BASE_URL}/buku_tamu?select=nama&order=created_at.desc`, { headers });
        const data = await res.json();

        if (!res.ok) {
          console.error("Detail Error Supabase:", data);
          alert(`Gagal (Status ${res.status}): ${data.message || JSON.stringify(data)}`);
          return;
        }

        document.getElementById('daftar').innerHTML = data.map(item => `<li>${item.nama}</li>`).join('');
      } catch (err) {
        console.error("Gagal koneksi:", err);
      }
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      
      const res = await fetch(`${SUPABASE_BASE_URL}/buku_tamu`, {
        method: "POST",
        headers,
        body: JSON.stringify({ nama })
      });

      if (res.ok) {
        document.getElementById('nama').value = '';
        load();
      } else {
        const errData = await res.json();
        alert(`Gagal Simpan: ${errData.message || 'Cek RLS / API Key'}`);
      }
    });

    load();
  </script>
</body>
</html>
