<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Tamu Saya, Tau ....</title>
    <!-- Script Supabase resmi versi terbaru -->
<script src="https://unpkg.com"></script>
</head>
<body>
    <h1>Buku Tamu Website</h1>
    
    <!-- Formulir untuk mengetik nama -->
    <input type="text" id="namaTamu" placeholder="Ketik nama Anda di sini...">
    <button onclick="simpanKeSupabase()">Kirim Nama</button>

    <h3>Daftar Tamu yang Hadir:</h3>
    <ul id="daftarTamu"></ul>

    <script>
        // ISI DENGAN KUNCI SUPABASE ANDA (Pastikan di dalam tanda kutip "")
        const SUPABASE_URL = "https://wprvdlbfsurjytgikokp.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_Vl18fW-IfHmiNdwtOAFygQ_yHDckGA7";
        
        // Menyalakan koneksi ke Supabase (Format terbaru yang aman dari error)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // FUNGSI UNTUK MENGIRIM NAMA KE SUPABASE
        async function simpanKeSupabase() {
            const namaInput = document.getElementById('namaTamu').value;
            
            if(namaInput === "") {
                alert("Ketik namanya dulu ya!");
                return;
            }

            // Memasukkan data ke tabel 'para_tamu'
            const { data, error } = await supabase
                .from('para_tamu')
                .insert([{ nama: nama }]);

            if (error) {
                alert("Gagal menyimpan: " + error.message);
            } else {
                alert("Hore! Nama " + nama + " berhasil disimpan ke database!");
                document.getElementById('namaTamu').value = ""; // Kosongkan kotak teks
                tampilkanDaftarTamu(); // Perbarui daftar di layar
            }
        }

        // FUNGSI UNTUK MENAMPILKAN DAFTAR TAMU DARI SUPABASE
        async function tampilkanDaftarTamu() {
            const { data: semuaTamu, error } = await supabase
                .from('para_tamu')
                .select('*');

            if (!error) {
                const listData = document.getElementById('daftarTamu');
                listData.innerHTML = ""; // Bersihkan daftar lama
                
                semuaTamu.forEach(tamu => {
                    const li = document.createElement('li');
                    li.textContent = tamu.nama;
                    listData.appendChild(li);
                });
            }
        }

        // Jalankan otomatis saat halaman dibuka
        tampilkanDaftarTamu();
    </script>
</body>
</html>
