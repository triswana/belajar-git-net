<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Tamu</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    li { margin-bottom: 5px; }
  </style>
  <!-- Library Resmi Supabase via CDN (Tanpa NPM/Terminal) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <h3>Buku Tamu</h3>

  <form id="form">
    <input type="text" id="nama" placeholder="Isi nama Anda" required>
    <button type="submit">Kirim</button>
  </form>

  <h4>Daftar Hadir</h4>
  <ul id="daftar"></ul>

  <script>
    const SUPABASE_URL = "https://wprvdlbfsurjytgikokp.supabase.co";
    const PUBLISHABLE_KEY = "sb_publishable_Vl18fW-IfHmiNdwtOAFygQ_yHDckGA7";

    // Inisialisasi client Supabase dengan Publishable Key
    const supabaseClient = supabase.createClient(SUPABASE_URL, PUBLISHABLE_KEY);

    // Ambil data dari tabel buku_tamu
    async function load() {
      const { data, error } = await supabaseClient
        .from('buku_tamu')
        .select('nama')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error:", error);
        document.getElementById('daftar').innerHTML = `<li style="color:red">Error: ${error.message}</li>`;
        return;
      }

      document.getElementById('daftar').innerHTML = data.map(item => `<li>${item.nama}</li>`).join('');
    }

    // Simpan data ke tabel buku_tamu
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;

      const { error } = await supabaseClient
        .from('buku_tamu')
        .insert([{ nama }]);

      if (!error) {
        document.getElementById('nama').value = '';
        load();
      } else {
        alert("Gagal menyimpan: " + error.message);
      }
    });

    load();
  </script>
</body>
</html>
