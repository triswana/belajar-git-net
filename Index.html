
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Buku Tamu</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
    li { margin-bottom: 5px; }
  </style>
</head>
<body>

  <h3>Buku Tamu</h3>

  <form id="form">
    <input type="text" id="nama" placeholder="Isi nama Anda" required>
    <button type="submit">Kirim</button>
  </form>

  <h4>Daftar Hadir</h4>
  <ul id="daftar"></ul>

  <script>
         const SUPABASE_URL = "https://wprvdlbfsurjytgikokp.supabase.co/rest/v1/";
        const SUPABASE_KEY = "sb_publishable_Vl18fW-IfHmiNdwtOAFygQ_yHDckGA7";

    const headers = {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    };

    async function load() {
      const res = await fetch(`${SUPABASE_URL}?select=nama&order=created_at.desc`, { headers });
      const data = await res.json();
      document.getElementById('daftar').innerHTML = data.map(item => `<li>${item.nama}</li>`).join('');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      await fetch(SUPABASE_URL, {
        method: "POST",
        headers,
        body: JSON.stringify({ nama })
      });
      document.getElementById('nama').value = '';
      load();
    });

    load();
  </script>
</body>
</html>
